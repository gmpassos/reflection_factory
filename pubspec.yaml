name: reflection_factory
description: Allows Dart reflection with an easy approach, even for third-party classes, using code generation portable for all Dart platforms.
version: 2.12.1
homepage: https://github.com/gmpassos/reflection_factory

environment:
  sdk: '>=3.13.2 <4.0.0'

dependencies:
  build: ^4.0.11
  analyzer: ^14.5.0
  dart_style: '>=3.1.13 <3.1.14'
  meta: ^1.18.1
  mime: ^2.1.0
  base_codecs: ^1.0.1
  pub_semver: ^2.2.1
  path: ^1.9.1
  collection: ^1.19.1
  yaml: ^3.1.4
  source_span: ^1.10.2
  logging: ^1.3.0

dev_dependencies:
  build_runner: ^2.16.2
  build_test: ^3.5.21
  lints: ^6.1.0
  pubspec_parse: ^1.6.0
  data_serializer: ^1.2.3
  #dependency_validator: ^5.0.2
  test: ^1.33.0
  coverage: ^1.15.0
  benchmark: ^0.3.0
